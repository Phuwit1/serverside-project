<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Menu</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #181818; 
            margin: 0;
            padding: 20px;
            color: #f2f2f2; 
        }
        h1 {
            color: #ff1900; 
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 1px 1px 2px #000; 
        }
        a {
            text-decoration: none;
            color: white;
            background-color: #ff1900; 
            padding: 10px 15px;
            border-radius: 5px;
            transition: background-color 0.3s, transform 0.2s; /* การเคลื่อนไหว */
        }
        a:hover {
            background-color: #c6a9a6; 
            transform: scale(1.05);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        table, th, td {
            border: 1px solid #c0392b; 
        }
        th, td {
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #ff1900; 
            color: white;
        }
        
        .action-buttons {
            display: flex;
            gap: 10px;
        }
    </style>
</head>
<body>
    <h1>Manage Menu</h1>

    <a href="{% url 'menu_create' %}">Add New Menu Item</a>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Price</th>
                <th>Description</th>
                <th>Image</th>
                <th>Actions</th> 
            </tr>
        </thead>
        <tbody>
            {% for menu_item in menu_items %}
            <tr>
                <td>{{ menu_item.name }}</td>
                <td>{{ menu_item.price }}</td>
                <td>{{ menu_item.description }}</td>
                <td>
                    <!-- โชว์รูปเมนู แต่ทำไม่เป็น 
                      
                    
                    จริงๆแล้ว ถามchatละมันแตก 55555555-->
                </td>
                <td class="action-buttons">
                    <a href="{% url 'menu_edit' menu_item.id %}">Edit</a>
                    <a href="{% url 'menu_delete' menu_item.id %}" onclick="return confirm('Are you sure you want to delete this item?');">Delete</a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="5">No menu items available</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
