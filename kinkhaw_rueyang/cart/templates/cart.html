<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart</title>
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    {% include 'nav.html' %}
    <div class="container mt-5">
        {% if cart %}
            <h1 class="h4">Your Cart</h1>
            {% for i in cart.cartitem_set.all %}
                <div class="card mb-3">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <a href="{% url 'cartitemview' i.id %}" class="text-decoration-none">
                            <h5 class="card-title mb-0">{{i.menu.name}} x{{i.quantity}}</h5>
                            <p class="mb-0">{{i.price}}</p>
                        </a>
                        <form action="{% url 'delete_cart_item' i.id %}" method="post" class="ml-2">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-danger btn-sm"><i class="fas fa-trash"></i></button>
                        </form>
                    </div>
                </div>
            {% endfor %}
            <form action="{% url "customercart" %}" method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-primary">Total: {{cart.sum}}</button>
            </form>
        {% else %}
            <h1 class="h5 text-center">Your cart is empty</h1>
        {% endif %}
    </div>
</body>
</html>
