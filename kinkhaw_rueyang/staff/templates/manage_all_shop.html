<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage All Shop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center">Manage All Shops</h1>
        
        <form method="post" action="{% url 'searchshop' %}" class="mb-4">
            {% csrf_token %}
            <div class="input-group">
                <input type="text" name="search" class="form-control" placeholder="ค้นหาชื่อร้านอาหารได้ที่นี่...">
                <div class="input-group-append">
                    <button type="submit" class="btn btn-primary">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                </div>
            </div>
        </form>

        {% if shop %}
            <div class="list-group">
                {% for i in shop %}
                    <form method="post" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                        {% csrf_token %}
                        <a href="{% url "seeshopdetail" i.id %}" class="flex-grow-1 text-decoration-none text-dark">
                            <label>{{i.id}}: </label>
                            <strong>{{i.name}}</strong><br>
                            <small>{{i.description}}</small><br>
                            <small>โทร: {{i.phone_number}}</small><br>
                            <small>เจ้าของ: {{i.shopkeeper.userprofile.first_name}} {{i.shopkeeper.userprofile.last_name}}</small>
                        </a>
                        <input type="hidden" name="shopid" value="{{i.id}}">
                        <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                    </form>
                {% endfor %}
            </div>
        {% else %}
            <p class="text-center">ไม่มีร้านอาหารที่แสดงอยู่ในขณะนี้</p>
        {% endif %}
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
