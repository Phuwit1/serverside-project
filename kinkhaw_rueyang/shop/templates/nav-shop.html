<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop Navigation</title>
  <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .nav-item {
      font-weight: 500;
    }

    .nav-item .nav-link {
      color: black !important;
    }

    .nav-link:hover {
      color: #007bff !important;
     
    }
  </style>
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-light">
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav"
      aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav">
        {% for group in user.groups.all %}
        {% if group.name == "Shop" %}
        <li class="nav-item">
          <a class="nav-link" href="{% url 'shop' %}">Manage Menu</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'manage_order' %}">Manage Order</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'daily_summary' %}">Daily Summary</a>
        </li>
        {% endif %}
        {% endfor %}

        {% if user.is_staff %}
        <li class="nav-item">
          <a class="nav-link" href="{% url 'manageallshop' %}">Manage Shops</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'managealluser' %}">Manage Users</a>
        </li>
        {% endif %}
      </ul>

      <ul class="navbar-nav ml-auto">
        <li class="nav-item">
          <a class="nav-link" href="{% url 'myprofile' %}">My Profile</a>
      </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'logout' %}">Logout</a>
        </li>
      </ul>
    </div>
  </nav>

  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>

</html>
