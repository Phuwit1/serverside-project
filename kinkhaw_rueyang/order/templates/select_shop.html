<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order</title>
</head>
<body>
    {% if shop %}
        {% for i in shop %}
            {% url "selectmenu" i.id 0 as selm %}
            <a href="{{selm}}" style="color: black; text-decoration: none;"> {%comment%} เพิ่ม style ไว้เฉยๆ แยกไว้ข้างนอกทีหลัง {%endcomment%} 
                <div style="background-color: yellow;">
                    <h1>{{i.name}}</h1>
                    <p>{{i.description}}</p>
                    <p>{{i.count_order}}</p>
                </div>
            </a>
        {% endfor %}
    {% else %}
        <h1>🐋 ไม่มีร้านไหนเปิดเลยแย่จัง 🐋</h1>
    {% endif %}
</body>
</html>
