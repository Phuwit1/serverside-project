<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu</title>
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert/2.1.2/sweetalert.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/sweetalert/2.1.2/sweetalert.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">

    <style>
        .amount-label {
            cursor: pointer;
            font-size: 1.5rem;
        }
        .frame {
            margin: 15px
        }
        .image-crop {
            margin-top: 50px;
            width: 100%;
            height: 300px;
            overflow: hidden;
            position: relative;
        }

        .image-crop img {
            position: absolute;
            top: 50%;
            left: 50%;
            width: auto;
            height: auto;
            min-width: 100%;
            min-height: 100%;
            transform: translate(-50%, -50%);
            z-index: -1;
        }
        .top-right {
            position: absolute;
            top: 5px;
            right: 10px;
            z-index: 1000;
        }
        .larger-icon {
            font-size: 2rem;
            color: black;
        }
    </style>
</head>
<body>
    <div class="top-right">
        <a href="{% url "selectmenu" menu.shop.id 0 %}"><i class="bi bi-x-circle-fill larger-icon"></i></a>
    </div>
    <form method="post" id="form">
        {% csrf_token %}
        {% if menu %}
            <div class="frame">
                <div class="image-crop">
                    {% if menu.image %}
                        <img src="{{ menu.image.url }}" alt="{{ menu.name }}" class="img-fluid">
                    {% else %}
                        <span class="text-muted">No Image Available</span>
                    {% endif %}
                </div>
                <h1>{{menu.name}}</h1>
                <p>{{menu.description}}</p>
                <div class="d-flex justify-content-center align-items-center mb-4">
                    <label class="amount-label" onclick="decreaseAmount()">-</label>
                    <label id="amount" class="mx-3">1</label>
                    <input type="hidden" id="amount_input" name="amount" value="1">
                    <label class="amount-label" onclick="increaseAmount()">+</label>
                </div>
            </div>
        {% endif %}
    </form>
    <div class="text-center">
        <button class="btn btn-primary" onclick="checkshop({{ menu.shop.id }}, {{ cart }}, form)">Add to Cart</button>
    </div>
</body>
</html>

<script>
    function decreaseAmount() {
        let amountLabel = document.getElementById('amount');
        let amountInput = document.getElementById('amount_input');
        let currentAmount = parseInt(amountLabel.innerHTML);
        if (currentAmount > 1) {
            currentAmount -= 1;
            amountLabel.innerHTML = currentAmount;
            amountInput.value = currentAmount;
        }
    }

    function increaseAmount() {
        let amountLabel = document.getElementById('amount');
        let amountInput = document.getElementById('amount_input');
        let currentAmount = parseInt(amountLabel.innerHTML);
        currentAmount += 1;
        amountLabel.innerHTML = currentAmount;
        amountInput.value = currentAmount;
    }

    function checkshop(shop, cart, form) {
        if (shop != cart && cart != 0) {
            swal({
                title: 'Warning',
                text: 'The old cart will be deleted because you are changing shops.',
                icon: 'warning',
                buttons: {
                    cancel: "Cancel",
                    confirm: {
                        text: "OK",
                        value: true,
                        visible: true,
                        className: "btn-danger",
                        closeModal: true
                    }
                }
            }).then((userConfirm) => {
                if (userConfirm) {
                    document.getElementById('form').submit();
                }
            });
        } else {
            document.getElementById('form').submit();
        }
    }
    
</script>
